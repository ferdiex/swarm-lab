[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-lab"
version = "0.1.0"
description = "Swarm lab: teams of simulated e-puck robots race to their food (AI course final project)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy", "pybullet", "matplotlib"]

[project.scripts]
swarm = "swarm.cli:main"

[tool.setuptools]
packages = ["swarm", "swarm.sim"]

[tool.setuptools.package-data]
swarm = ["data/*", "robots/*", "template/*", "sparring/*", "sim/config.json"]
